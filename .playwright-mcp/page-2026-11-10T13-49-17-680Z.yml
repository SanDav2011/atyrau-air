  - generic [ref=f1e39]:
    - generic [ref=f1e40]: Метод и ограничения
    - heading "Как считали" [level=2] [ref=f1e41]
    - list [ref=f1e42]:
      - listitem [ref=f1e43]: "Источник: почасовые значения постов (ecodata.kz, Казгидромет), собранные сайтом «Қазақстан ауасы»; учтены только почасовые посты в черте города (до 12 км от центра). Ручные посты (одно измерение в сутки) и посты области (Тенгиз, Кульсары, Макат, Жанбай, Ганюшкино, Дамба) не входят."
      - listitem [ref=f1e44]: "Порог: максимальная разовая ПДК по приказу № ҚР ДСМ-70 (02.08.2022), прил. 1: H₂S 8, NO₂ 200, NO 400, SO₂ 500, CO 5000, O₃ 160, NH₃ 200, PM10 300, PM2.5 160 мкг/м³. Превышение = значение строго больше порога."
      - listitem [ref=f1e45]: "Посты дают среднечасовое значение, а разовая ПДК рассчитана на 20–30 минут: сравнение приблизительное. Кратковременные пики внутри часа не видны."
      - listitem [ref=f1e46]: Исключены «застывшие» значения (одно и то же число 6+ часов подряд без движения вокруг) и CO на постах с сомнительной единицей.
      - listitem [ref=f1e47]: "Данные не показывают, какое предприятие виновно: это только факт превышения на посту. Источник запаха определяется отдельно (модель — направление, не доказательство)."