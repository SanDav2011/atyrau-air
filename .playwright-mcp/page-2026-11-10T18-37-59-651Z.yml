        - heading "Жиі қойылатын сұрақтар" [level=2] [ref=f17e214]
        - generic [ref=f17e215]:
          - heading "Атыраудағы H₂S иісі қайдан келеді?" [level=3] [ref=f17e216]
          - paragraph [ref=f17e217]: Сайт нақты көзді дәлелдемейді. Ол бекеттерде H₂S өскен сағатта жел қай жақтан соққанын көрсетеді және Гаусс шлейфі моделімен ықтимал бағытты есептейді. Иіс желдің бағытындағы өнеркәсіп нысандарымен байланысты болуы мүмкін, бірақ бұл — болжам.
        - generic [ref=f17e218]:
          - heading "Деректер қайдан алынады?" [level=3] [ref=f17e219]
          - paragraph [ref=f17e220]: Ауа сапасы — Қазгидромет бекеттері (ecodata.kz), сағат сайын. Жел мен метеорология — Open-Meteo.
        - generic [ref=f17e221]:
          - heading "H₂S қауіпті ме?" [level=3] [ref=f17e222]
          - paragraph [ref=f17e223]: Жоғары концентрацияда күкіртсутек улы. Сайт өлшемдерді ҚР ДСМ-70 бұйрығындағы (02.08.2022) ең жоғары бір реттік ПДК-мен салыстырады; бекеттер сағаттық мән береді, сондықтан салыстыру шамамен. Денсаулыққа қатысты шешімді мамандардан сұраңыз.
        - generic [ref=f17e224]:
          - heading "Модель қаншалықты нақты?" [level=3] [ref=f17e225]
          - paragraph [ref=f17e226]: "Модель жеңілдетілген: Пасквилл–Гиффорд сыныптары мен Бриггс формулалары қолданылады, көздердің биіктігі жуықтап алынған. Сондықтан нәтижені ресми өлшем ретінде қолдануға болмайды."
