        - heading "Жиі қойылатын сұрақтар" [level=2] [ref=f21e105]
        - generic [ref=f21e106]:
          - heading "Атыраудағы H₂S иісі қайдан келеді?" [level=3] [ref=f21e107]
          - paragraph [ref=f21e108]: Сайт нақты көзді дәлелдемейді. Ол бекеттерде H₂S өскен сағатта жел қай жақтан соққанын көрсетеді және Гаусс шлейфі моделімен ықтимал бағытты есептейді. Иіс желдің бағытындағы өнеркәсіп нысандарымен байланысты болуы мүмкін, бірақ бұл — болжам.
        - generic [ref=f21e109]:
          - heading "Деректер қайдан алынады?" [level=3] [ref=f21e110]
          - paragraph [ref=f21e111]: Ауа сапасы — Қазгидромет бекеттері (ecodata.kz), сағат сайын. Жел мен метеорология — Open-Meteo.
        - generic [ref=f21e112]:
          - heading "H₂S қауіпті ме?" [level=3] [ref=f21e113]
          - paragraph [ref=f21e114]: Жоғары концентрацияда күкіртсутек улы. Сайт өлшемдерді ҚР ДСМ-70 бұйрығындағы (02.08.2022) ең жоғары бір реттік ПДК-мен салыстырады; бекеттер сағаттық мән береді, сондықтан салыстыру шамамен. Денсаулыққа қатысты шешімді мамандардан сұраңыз.
        - generic [ref=f21e115]:
          - heading "Модель қаншалықты нақты?" [level=3] [ref=f21e116]
          - paragraph [ref=f21e117]: "Модель жеңілдетілген: Пасквилл–Гиффорд сыныптары мен Бриггс формулалары қолданылады, көздердің биіктігі жуықтап алынған. Сондықтан нәтижені ресми өлшем ретінде қолдануға болмайды."
