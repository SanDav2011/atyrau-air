      - listitem [ref=f3e20]: "мкр. Шагала (СМКВ №103, NCOC (СМКВ)): H₂S выше ПДК в течение 3 ч; максимум 15 мкг/м³ = ×1,9 ПДК (01.11 21:00)."
      - listitem [ref=f3e21]: "Центр (район акимата) (СМКВ №112, NCOC (СМКВ)): H₂S выше ПДК в течение 2 ч; максимум 15 мкг/м³ = ×1,9 ПДК (03.11 21:00)."
      - listitem [ref=f3e22]: "мкр. Самал (ПНЗ№17, Казгидромет): NO₂ выше ПДК в течение 13 ч; максимум 313 мкг/м³ = ×1,6 ПДК (05.11 11:00)."
    - paragraph [ref=f3e23]: На остальных 9 основных постах превышений ПДК за период не было. На основных постах превышения H₂S зафиксированы только в центральной части города (мкр. Восток, Шагала, район акимата) — по постам NCOC; на постах Казгидромета H₂S не превышал ПДК. Посты АМӨЗ — отдельно ниже, их значения требуют проверки.
