        - heading "Жиі қойылатын сұрақтар" [level=2] [ref=f19e104]
        - generic [ref=f19e105]:
          - heading "Атыраудағы H₂S иісі қайдан келеді?" [level=3] [ref=f19e106]
          - paragraph [ref=f19e107]: Сайт нақты көзді дәлелдемейді. Ол бекеттерде H₂S өскен сағатта жел қай жақтан соққанын көрсетеді және Гаусс шлейфі моделімен ықтимал бағытты есептейді. Иіс желдің бағытындағы өнеркәсіп нысандарымен байланысты болуы мүмкін, бірақ бұл — болжам.
        - generic [ref=f19e108]:
          - heading "Деректер қайдан алынады?" [level=3] [ref=f19e109]
          - paragraph [ref=f19e110]: Ауа сапасы — Қазгидромет бекеттері (ecodata.kz), сағат сайын. Жел мен метеорология — Open-Meteo.
        - generic [ref=f19e111]:
          - heading "H₂S қауіпті ме?" [level=3] [ref=f19e112]
          - paragraph [ref=f19e113]: Жоғары концентрацияда күкіртсутек улы. Сайт өлшемдерді ҚР ДСМ-70 бұйрығындағы (02.08.2022) ең жоғары бір реттік ПДК-мен салыстырады; бекеттер сағаттық мән береді, сондықтан салыстыру шамамен. Денсаулыққа қатысты шешімді мамандардан сұраңыз.
        - generic [ref=f19e114]:
          - heading "Модель қаншалықты нақты?" [level=3] [ref=f19e115]
          - paragraph [ref=f19e116]: "Модель жеңілдетілген: Пасквилл–Гиффорд сыныптары мен Бриггс формулалары қолданылады, көздердің биіктігі жуықтап алынған. Сондықтан нәтижені ресми өлшем ретінде қолдануға болмайды."
