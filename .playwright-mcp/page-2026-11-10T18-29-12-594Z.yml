      - paragraph [ref=f9e228]: "Нысандармен байланыстыру дәл координатаны қажет етеді. Ашық нүктелер ±500 м дәлдікте, ал үлкен аумақты көздерді (Сасық сай, «Квадрат») нүкте ретінде көрсету нәтижені өзгертеді: көрші нысандардың реті тұрақсыз болып шықты, сондықтан нысандар бойынша рейтинг берілмейді. Сұр нүктелер — ашық болжамды нысандар (меңзегенде атауы шығады)."
