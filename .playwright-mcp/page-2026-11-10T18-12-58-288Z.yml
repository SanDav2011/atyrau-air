      - paragraph [ref=f7e259]: "Нысандар тізімі толық емес. Ашық координаталар ±500 м дәлдікте, ал Сасық сай мен «Квадрат» — үлкен аумақты көздер, оларды нүкте ретінде көрсету индексті төмендетеді. Сондықтан көрші нысандардың реті (мысалы, АНПЗ мен Сасық сай) тұрақты емес: дәл координатамен есептегенде Сасық сайдың индексі жоғары шықты. Бір нүктеде тұрған нысандардың индексі бірдей (траектория биіктікті ажыратпайды). Индекс жоғары нысан — «бағыт сәйкес», көз деген сөз емес."
    - paragraph [ref=f7e260]: "Шектеулер: жел — қала орталығының бір нүктесінен (Open-Meteo, 10 м), сағаттық; бекеттер бір-біріне 1–2 км жақын; асу аз; атмосфера тұрақтылығы ескерілмейді; 1 қарашаға дейінгі жел жоқ, сондықтан 1.11 таңындағы траекториялар қысқарады. Нысандар — ашық болжамды нүктелер (±500 м). Бұл қорытынды емес, тексеруге ұсыныс. Карта: Tiles © Esri."
