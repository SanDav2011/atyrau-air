name: Сбор погоды и постов Казгидромета (tabigat) — Атырау, Алматы, Астана, Ақтөбе, Ақтау, Орал

on:
  schedule:
    - cron: "7 * * * *"   # каждый час в :07 (UTC); GitHub иногда запускает с задержкой
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # нужна история, чтобы увидеть последний коммит ноутбука
      # Запасной режим: если ноутбук присылал данные за последние 1,5 часа — погоду и tabigat собирает он
      - name: Ноутбук работает?
        id: laptop
        run: |
          last=$(git log -1 --format=%ct --grep='^Посты' || echo 0)
          age=$(( $(date +%s) - ${last:-0} ))
          echo "Последний коммит ноутбука: $age с назад"
          if [ "$age" -lt 5400 ]; then echo "fresh=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
        if: steps.laptop.outputs.fresh != '1'
      # посты ecodata.kz с серверов GitHub не открываются — их собирает ноутбук; погоду и tabigat — тоже он, а здесь только запасной сбор
      - run: python collector/collect.py --only weather,kgm --log cloud.log
        if: steps.laptop.outputs.fresh != '1'
      # счётчик посещений GoatCounter → data/visits.json на нашем домене (блокировщики рекламы и кэш браузера не мешают)
      - name: Счётчик посещений
        continue-on-error: true
        run: |
          curl -sf https://atyrau-air.goatcounter.com/counter/TOTAL.json -o /tmp/v.json
          python -c "import json; d=json.load(open('/tmp/v.json')); assert 'count' in d; json.dump({'count': d['count']}, open('data/visits.json','w'))"
      - name: Сохранить данные в репозиторий
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wind.csv data/kgm.csv data/cloud.log data/almaty/ data/astana/ data/aktobe/ data/aktau/ data/oral/
          [ -f data/visits.json ] && git add data/visits.json
          git diff --cached --quiet || git commit -m "Погода $(TZ=Asia/Almaty date '+%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs && git push
